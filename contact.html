<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contact's</h1>
    <br>
    <form>
            <div>
                <label>First Name</label>
                <input type="text" name="firstName" placeholder="Enter first name">
            </div>
            <br>
            <div>
                <label>last Name</label>
                <input type="email" name="lastName" placeholder="Enter last name">
            </div>
            <br>
            <div>
                <label>Email</label>
                <input type="text" name="email" placeholder="name@explain.com">
            </div>
            <br>
            <div>
                <label for="age" >Age</label>
                <input type="number" name="age" min="1" max="120" placeholder="Your age"/>
            </div>
            <br>
            <div>
                <label>Message</label>
                <textarea name="Message" placeholder="Any message"></textarea>
            </div>
            <br>
            <div>
                <label>Topic choise</label>
                <select name="topic">
                    <option value="general">General</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <br>
            <fieldset>
                <legend>Preferred Contact Method</legend>
                <label>
                    <input type="radio" name="contact-method" value="email" /> Email
                </label>
                <label>
                    <input type="radio" name="contact-method" value="phone" /> Phone
                </label>
            </fieldset>
            <input type="submit" name="submit" value="Submit">
        </form>
</body>
</html>
