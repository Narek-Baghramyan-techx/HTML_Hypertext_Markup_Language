<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <style type="text/css">
        #main-header{
            text-align: center;
            background-color: rgb(161, 127, 255);
            color: aliceblue;
            padding: auto;
        }
    </style>
</head>
<body>
    <header id="main-header">
        <h1>Beautiful images</h1>
    </header>
    <section>
        <br>
        <h3>Red Panda</h3>
        <br>
        <a href="Image/redPanda.jpeg" target="_blank">
            <img src="Image/redPanda.jpeg" alt="Please wait" width="500">
        </a>
    </section>
    <section>
        <h3>Bear</h3>
        <br>
        <picture>
            <source media="(max-width: 600px)" srcset="Image/bear.jpg" />
            <source media="(min-width: 601px)" srcset="Image/bear.jpg" />
            <img src="Image/bear.jpg" alt="Responsive example image" />
        </picture>
    </section>
    <section>
        <h3>Parrot</h3>
        <br>
        <video width="500" controls>
            <source src="media/Parrot.mp4" type="video/mp4" />
            Your browser does not support the video tag.
    </section>
    <section>
        <h3>Best Funny Animal</h3>
        <br>
        <iframe width="560" height="315" src="https://www.youtube.com/watch?v=lUSkQ8-SBV4" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </section>
    <section>
        <h2>Google Map</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509463!2d144.9537363153168!3d-37.81627977975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d43f3aa4df1%3A0x5045675218ce840!2sMelbourne%20VIC%2C%20Australia!5e0!3m2!1sen!2sus!4v1614111111111"
            width="600"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
        </iframe>
    </section>

</body>
</html>
